# 类人叙事评估器默认配置
# 优先级：此处配置 > 默认值（config.py）；命令行参数可进一步覆盖采样数等

data:
  n_h_webnovel: 200        # WebNovelBench 章节采样（含人类评分）
  n_h_cnnsum: 300          # CNNSum 人类长篇小说
  n_g_coig: 300            # COIG-Writer AI 创意写作
  n_g_realdet: 0           # RealDet MGT 补充（默认关闭）
  max_chars: 8000
  max_chars_cnnsum: 30000
  seed: 42
  eval_fraction: 0.2        # 独立留出 20% 测试集，报告不使用训练样本

encoder:
  name: "BAAI/bge-small-zh-v1.5"
  max_len: 512
  batch_size: 32
  device: "cpu"

discriminator:
  ngram_range: [1, 3]
  max_features: 50000
  cv_folds: 5

mix:
  lambda_disc: 0.333333
  lambda_repr: 0.333333
  lambda_attr: 0.333333
  strict_alpha: 0.2
  strict_len_base: 0        # 0 = fit 时用 H 中位长度
  reference_cache_path: "data/eval_dataset/models/h_reference_default.npz"

report:
  out_dir: null            # null = 仅控制台输出；填路径则写报告文件
  top_attributes: 8
